version: '3.8'

services:
  app:
    build: .
    container_name: coverscore-ai
    restart: unless-stopped
    ports:
      - "3016:3016"
    environment:
      - NODE_ENV=production
      - PORT=3016
      - DB_PATH=/app/data/coverscore.db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MISTRAL_MODEL=${MISTRAL_MODEL}
      - SMTP_SERVICE=${SMTP_SERVICE}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_PHONE=${ADMIN_PHONE}
      - APP_URL=${APP_URL}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_API_INSTANCE=${EVOLUTION_API_INSTANCE}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3016/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: coverscore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coverscore_admin
      POSTGRES_PASSWORD: coverscore_password
      POSTGRES_DB: coverscore_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_schema.sql:/docker-entrypoint-initdb.d/init.sql

  node-red:
    image: nodered/node-red:latest
    container_name: coverscore_nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - ./node-red:/data
    environment:
      - TZ=Africa/Lagos
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=coverscore_db
      - POSTGRES_USER=coverscore_admin
      - POSTGRES_PASSWORD=coverscore_password
      - EVOLUTION_API_BASE_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=coverscore-evo-secret
      - EVOLUTION_INSTANCE_NAME=coverscore-main
      - REPORT_BASE_URL=http://app:3016
    depends_on:
      - postgres

volumes:
  postgres_data:
