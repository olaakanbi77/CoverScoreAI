<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Inbox - CoverScore AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0f0f13;
            color: #e1e1e6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 520px;
            width: 100%;
            padding: 24px;
        }
        .card {
            background: #1a1a23;
            border: 1px solid #2a2a3a;
            border-radius: 16px;
            padding: 40px 32px;
            text-align: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #22c55e;
            margin-bottom: 8px;
        }
        .logo span { color: #e1e1e6; }
        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .qr-wrapper {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            display: inline-block;
            margin-bottom: 16px;
            position: relative;
        }
        #qrImage {
            width: 280px;
            height: 280px;
            display: block;
            image-rendering: pixelated;
        }
        .placeholder {
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            border-radius: 8px;
            color: #666;
            font-size: 14px;
            flex-direction: column;
            gap: 12px;
        }
        .placeholder svg { opacity: 0.3; }
        #status {
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .status-loading { background: #1e293b; color: #60a5fa; }
        .status-connected { background: #052e16; color: #4ade80; }
        .status-disconnected { background: #3b1119; color: #f87171; }
        .status-error { background: #3b1119; color: #fbbf24; }
        .steps {
            text-align: left;
            background: #12121c;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .steps h3 {
            font-size: 13px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .step {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 8px 0;
            font-size: 14px;
            color: #aaa;
        }
        .step-num {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #2a2a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: #888;
            flex-shrink: 0;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #888;
            text-decoration: none;
            font-size: 13px;
            margin-top: 16px;
            transition: color 0.2s;
        }
        .back-link:hover { color: #22c55e; }
        .countdown {
            font-size: 12px;
            color: #555;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">CoverScore <span>AI</span></div>
            <h2>WhatsApp Inbox</h2>
            <p class="subtitle">Link your WhatsApp to send and receive messages directly from CoverScore AI</p>

            <div class="qr-wrapper">
                <div id="qrContainer">
                    <div class="placeholder" id="qrPlaceholder">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="7" y="7" width="3" height="3"/><rect x="14" y="7" width="3" height="3"/><rect x="7" y="14" width="3" height="3"/><rect x="14" y="14" width="3" height="3"/></svg>
                        Loading QR code...
                    </div>
                    <img id="qrImage" style="display:none;" alt="WhatsApp QR Code" />
                </div>
            </div>

            <div id="status" class="status-loading">Connecting...</div>
            <div class="countdown" id="countdown"></div>

            <div class="steps">
                <h3>How to connect</h3>
                <div class="step"><span class="step-num">1</span> Open WhatsApp on your phone</div>
                <div class="step"><span class="step-num">2</span> Tap <strong>Menu</strong> (⋮) → <strong>Linked Devices</strong></div>
                <div class="step"><span class="step-num">3</span> Tap <strong>Link a Device</strong></div>
                <div class="step"><span class="step-num">4</span> Scan the QR code above</div>
            </div>

            <a href="/admin/dashboard" class="back-link">← Back to Dashboard</a>
        </div>
    </div>

    <script>
        let refreshInterval = null;
        let countdownInterval = null;
        let secondsUntilRefresh = 30;

        const qrImage = document.getElementById('qrImage');
        const qrPlaceholder = document.getElementById('qrPlaceholder');
        const statusEl = document.getElementById('status');
        const countdownEl = document.getElementById('countdown');

        function setStatus(text, className) {
            statusEl.textContent = text;
            statusEl.className = className;
        }

        function updateCountdown() {
            countdownEl.textContent = `Refreshing in ${secondsUntilRefresh}s`;
        }

        async function fetchQR() {
            try {
                setStatus('Connecting...', 'status-loading');
                secondsUntilRefresh = 30;
                updateCountdown();

                const res = await fetch('/api/whatsapp/qr');
                const data = await res.json();

                if (data.success && data.qr) {
                    qrImage.src = data.qr;
                    qrImage.style.display = 'block';
                    qrPlaceholder.style.display = 'none';
                    setStatus(data.connected ? 'WhatsApp Connected' : 'Scan QR to connect', data.connected ? 'status-connected' : 'status-disconnected');
                } else if (data.base64) {
                    qrImage.src = data.base64.startsWith('data:') ? data.base64 : 'data:image/png;base64,' + data.base64;
                    qrImage.style.display = 'block';
                    qrPlaceholder.style.display = 'none';
                    setStatus('Scan QR to connect', 'status-disconnected');
                } else if (data.qrcode) {
                    qrImage.src = data.qrcode.startsWith('data:') ? data.qrcode : 'data:image/png;base64,' + data.qrcode;
                    qrImage.style.display = 'block';
                    qrPlaceholder.style.display = 'none';
                    setStatus('Scan QR to connect', 'status-disconnected');
                } else {
                    qrImage.style.display = 'none';
                    qrPlaceholder.style.display = 'flex';
                    setStatus(data.message || 'No QR code available', 'status-error');
                }
            } catch (err) {
                qrImage.style.display = 'none';
                qrPlaceholder.style.display = 'flex';
                setStatus('Failed to connect. Retrying...', 'status-error');
            }
        }

        function startRefresh() {
            fetchQR();
            refreshInterval = setInterval(() => {
                secondsUntilRefresh = 30;
                fetchQR();
            }, 30000);
            countdownInterval = setInterval(() => {
                secondsUntilRefresh--;
                if (secondsUntilRefresh <= 0) secondsUntilRefresh = 30;
                updateCountdown();
            }, 1000);
        }

        startRefresh();
    </script>
</body>
</html>
